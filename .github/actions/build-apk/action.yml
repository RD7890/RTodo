name: Build RTodo APK
description: Sets up JDK + Gradle, signs with a throwaway key, stamps the version and builds a release APK.

inputs:
  version_name:
    description: versionName to stamp into the APK (e.g. 1.0.0)
    required: true
  version_code:
    description: Integer versionCode to stamp into the APK
    required: true

outputs:
  apk_path:
    description: Path of the built APK
    value: ${{ steps.pack.outputs.apk_path }}
  apk_name:
    description: File name of the built APK
    value: ${{ steps.pack.outputs.apk_name }}
  cert_sha256:
    description: SHA-256 of the signing certificate
    value: ${{ steps.pack.outputs.cert_sha256 }}

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: ${{ runner.os }}-gradle-

    # Always use a fresh throwaway key so the build never blocks on missing secrets.
    - name: Generate throwaway signing key
      id: sign
      shell: bash
      run: |
        mkdir -p signing
        PW=$(openssl rand -hex 20)
        echo "::add-mask::$PW"
        keytool -genkeypair \
          -keystore signing/signing-key.jks \
          -alias rtodo \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$PW" -keypass "$PW" \
          -dname "CN=RTodo Build, OU=CI, O=RD7890, C=IN"
        echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
        echo "KEY_ALIAS=rtodo"       >> "$GITHUB_ENV"
        echo "Generated throwaway signing key"

    - name: Write local.properties for signing
      shell: bash
      run: |
        printf 'signing.storeFile=signing/signing-key.jks\nsigning.storePassword=%s\nsigning.keyAlias=%s\nsigning.keyPassword=%s\n' \
          "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > local.properties

    - name: Stamp version into app/build.gradle.kts
      shell: bash
      env:
        VER_NAME: ${{ inputs.version_name }}
        VER_CODE: ${{ inputs.version_code }}
      run: |
        sed -i "s/versionCode = [0-9]*/versionCode = ${VER_CODE}/" app/build.gradle.kts
        sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
        echo "Stamped versionName=${VER_NAME} versionCode=${VER_CODE}"

    - name: Assemble release APK
      shell: bash
      run: |
        chmod +x ./gradlew
        set -o pipefail
        ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Rename and verify APK
      id: pack
      shell: bash
      env:
        VER_NAME: ${{ inputs.version_name }}
      run: |
        OUTDIR="app/build/outputs/apk/release"
        SRC="$OUTDIR/app-release.apk"
        if [ ! -f "$SRC" ]; then
          echo "::error::Expected $SRC was not produced."
          ls -la "$OUTDIR" || true
          exit 1
        fi
        APK="$OUTDIR/RTodo-v${VER_NAME}.apk"
        cp "$SRC" "$APK"
        CERT=""
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
        if [ -n "$APKSIGNER" ]; then
          OUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$OUT" | head -5
          CERT=$(echo "$OUT" | grep -i "certificate SHA-256" | head -1 | awk '{print $NF}')
        fi
        ls -lh "$APK"
        {
          echo "apk_path=$APK"
          echo "apk_name=$(basename "$APK")"
          echo "cert_sha256=$CERT"
        } >> "$GITHUB_OUTPUT"

    - name: Remove signing material
      if: always()
      shell: bash
      run: rm -rf signing local.properties
